<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="adUsersPageTitle">账号管理 · DormCare</title>
<meta name="description" content="DormCare 管理员端 — 更正宿舍、重置密码、发放账号。Account management of DormCare.">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="mark admin" aria-hidden="true">🧭</div>
      <div class="brand-text">
        <h1 data-i18n="adUsersPageTitle">账号管理 · DormCare</h1>
        <p data-i18n="adminSub">DormCare 运维管理台</p>
      </div>
    </div>
    <div class="topbar-right">
      <div class="lang" id="lang" role="group" aria-label="Language / 语言">
        <button type="button" data-lang="zh" aria-pressed="true">中文</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <div class="status" id="status" data-state="checking">
        <span class="dot"></span><span id="statusText" data-i18n="statusChecking">连接中…</span>
      </div>
    </div>
  </header>

  <nav class="rolebar" data-rolebar>
    <span class="here" data-i18n="roleAdmin">管理员</span>
    <span class="rolebar-note" id="adminIdentity"></span>
    <div class="userchip" id="userChip" hidden></div>
  </nav>

  <main class="stack">

    <section class="card">
      <div class="card-head">
        <h2><span aria-hidden="true">👥</span> <span data-i18n="adUsersSection">账号管理</span></h2>
        <div class="head-actions">
          <span class="count" id="adUserCount"></span>
          <button type="button" class="btn tiny" id="adReload" data-i18n="adReload">刷新</button>
          <button type="button" class="btn tiny primary" id="adNewStudentBtn" data-i18n="adNewStudent">新建学生</button>
          <button type="button" class="btn tiny" id="adNewWorkerBtn" data-i18n="adNewWorker">发放师傅账号</button>
        </div>
      </div>
      <p class="hint" data-i18n="adUsersHint"></p>

      <!-- 新建账号（默认隐藏） -->
      <div class="ad-create" id="adCreateCard" hidden>
        <h4 id="adCreateTitle" data-i18n="adCreateStudent">新建学生账号</h4>
        <div class="grid2">
          <div>
            <label class="lbl" id="adCreateUserLbl" for="adCreateUser" data-i18n="adAccount">账号</label>
            <input type="text" id="adCreateUser" maxlength="32" autocomplete="off" spellcheck="false"
                   data-i18n-ph="phAccount">
          </div>
          <div>
            <label class="lbl" for="adCreateName" data-i18n="lblRegName">姓名</label>
            <input type="text" id="adCreateName" maxlength="40" autocomplete="off" data-i18n-ph="phRegName">
          </div>
        </div>

        <div id="adCreateStudentFields">
          <div class="grid2">
            <div>
              <label class="lbl" for="adCreateCollege" data-i18n="lblRegCollege">所属书院</label>
              <select id="adCreateCollege"></select>
            </div>
            <div>
              <label class="lbl" for="adCreateBlock" data-i18n="lblBlock">楼栋 / 座</label>
              <select id="adCreateBlock"></select>
            </div>
          </div>
          <label class="lbl" for="adCreateDorm" data-i18n="lblRegDorm">宿舍号</label>
          <input type="text" id="adCreateDorm" maxlength="30" autocomplete="off" data-i18n-ph="phDorm">
        </div>

        <div id="adCreateWorkerFields" hidden>
          <div class="grid2">
            <div>
              <label class="lbl" for="adCreateTradeZh" data-i18n="adTradeZh">工种（中文）</label>
              <input type="text" id="adCreateTradeZh" maxlength="60" autocomplete="off">
            </div>
            <div>
              <label class="lbl" for="adCreateTradeEn" data-i18n="adTradeEn">工种（英文）</label>
              <input type="text" id="adCreateTradeEn" maxlength="60" autocomplete="off">
            </div>
          </div>
          <label class="lbl" for="adCreatePhone" data-i18n="adPhone">内部分机（选填）</label>
          <input type="text" id="adCreatePhone" maxlength="40" autocomplete="off">

          <label class="lbl">
            <span data-i18n="adSpecialties">可承接的报修类别</span>
          </label>
          <div class="chips types" id="adCreateSpecs"></div>

          <label class="addr-toggle ad-cert" for="adCreateCertified">
            <input type="checkbox" id="adCreateCertified">
            <span data-i18n="adCertified">持证技师</span>
          </label>
        </div>

        <label class="lbl" for="adCreatePass" data-i18n="lblPassword">密码</label>
        <input type="password" id="adCreatePass" maxlength="128" autocomplete="new-password"
               data-i18n-ph="adNewPw">

        <div class="row">
          <button type="button" class="btn primary" id="adCreateSubmit" data-i18n="adCreate">创建</button>
          <button type="button" class="btn ghost" id="adCreateCancel" data-i18n="adCancel">取消</button>
        </div>
        <p class="form-msg" id="adCreateMsg"></p>
      </div>

      <div class="ad-list" id="adUserList"></div>
    </section>

    <p class="form-msg" id="adMsg"></p>

  </main>

  <section class="setup-wrap">
    <div class="setup" id="setup" hidden>
      <h3><span aria-hidden="true">🔑</span> <span data-i18n="setupTitle">启用模型密钥</span></h3>
      <p data-i18n-html="setupBody"></p>
      <form id="setupForm" autocomplete="off">
        <input type="password" id="setupKey" autocomplete="off" spellcheck="false"
               data-i18n-ph="setupPlaceholder" data-i18n-aria="setupTitle">
        <button type="submit" class="btn primary" id="setupBtn" data-i18n="setupSubmit">启用</button>
      </form>
      <p class="form-msg" id="setupMsg"></p>
    </div>
  </section>

</div>
<script src="/common.js"></script>
<script src="/admin-users.js"></script>
</body>
</html>
