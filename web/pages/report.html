<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="studentReportTitle">我要报修 · DormCare</title>
<meta name="description" content="DormCare 学生端 · AI 智能受理与报修申请。Student repair request of DormCare.">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="app narrow">

  <header class="topbar">
    <div class="brand">
      <div class="mark" aria-hidden="true">🎓</div>
      <div class="brand-text">
        <h1 data-i18n="studentReportTitle">我要报修 · DormCare</h1>
        <p data-i18n="studentSub">DormCare 宿舍智能报修系统</p>
      </div>
    </div>
    <div class="topbar-right">
      <div class="lang" id="lang" role="group" aria-label="Language / 语言">
        <button type="button" data-lang="zh" aria-pressed="true">中文</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <div class="status" id="status" data-state="checking">
        <span class="dot"></span><span id="statusText" data-i18n="statusChecking">连接中…</span>
      </div>
    </div>
  </header>

  <nav class="rolebar" data-rolebar>
    <span class="here" data-i18n="roleStudent">学生</span>
    <span class="rolebar-note" data-i18n="menuStudentReport"></span>
    <div class="userchip" id="userChip" hidden></div>
  </nav>

  <main class="stack">

    <!-- ① 统一 AI 受理：文字、语音与图片共用同一条消息流 -->
    <section class="card">
      <div class="card-head">
        <h2><span aria-hidden="true">🤖</span> <span data-i18n="intakeTitle">AI 智能受理</span></h2>
        <span class="tag ai" data-i18n="tagRag">RAG</span>
      </div>
      <p class="hint" data-i18n="intakeHint">输入文字、语音或图片，多轮补充信息；确认草稿后才会创建工单。</p>
      <ol class="intake-steps" id="intakeSteps" data-i18n-aria="intakeProgress"
          aria-label="受理进度">
        <li data-step="describe" class="active" data-i18n="stepDescribe">描述问题</li>
        <li data-step="assist" data-i18n="stepAssist">AI 追问 / 建议</li>
        <li data-step="draft" data-i18n="stepDraft">工单草稿</li>
        <li data-step="confirm" data-i18n="stepConfirm">确认提交</li>
      </ol>
      <div class="agent-log" id="agentLog" hidden></div>
      <div class="agent-result" id="agentResult" hidden>
        <div class="safety-alert" id="safetyAlert" hidden></div>
        <div class="agent-meta" id="agentMeta"></div>
        <p id="agentReply"></p>
        <div id="agentMissing" hidden></div>
        <div class="question-options" id="questionOptions" hidden></div>
        <div class="route-actions" id="routeActions" hidden>
          <button type="button" class="btn ghost" id="routeSelfHelp" data-i18n="routeSelfHelp">A 提供维修建议</button>
          <button type="button" class="btn primary" id="routeRepair" data-i18n="routeRepair">B 生成工单</button>
        </div>
      </div>
      <div class="agent-advice" id="agentAdvice" hidden>
        <h3 data-i18n="selfHelpTitle">可安全尝试的处理方法</h3>
        <ol id="selfHelpList"></ol>
        <div class="row">
          <button type="button" class="btn success" id="agentResolved" data-i18n="agentResolved">已解决，无需报修</button>
          <button type="button" class="btn primary" id="agentNeedRepair" data-i18n="agentNeedRepair">仍需师傅，生成工单</button>
        </div>
      </div>
      <textarea id="intakeText" rows="3" maxlength="2000"
                data-i18n-ph="agentPlaceholder" data-i18n-aria="intakeTitle"></textarea>
      <div class="row composer-tools">
        <button type="button" class="btn ghost" id="speechBtn" data-i18n="speechStart">语音转文字</button>
        <label class="btn ghost upload-btn" for="photoInput">
          <span data-i18n="photoChoose">拍照 / 相册</span>
          <input id="photoInput" type="file" accept="image/jpeg,image/png" capture="environment" multiple>
        </label>
        <span class="hint" id="speechHint" data-i18n="speechHint">语音结果进入同一输入框，可编辑后发送。</span>
      </div>
      <p class="hint" data-i18n="photoRules">仅 JPG/PNG，每张不超过 5MB。</p>
      <div class="image-grid" id="photoPreview"></div>
      <div class="row">
        <button type="button" class="btn primary" id="agentSend" data-i18n="agentSend">发送给 AI</button>
        <button type="button" class="btn ghost" id="intakeClearBtn" data-i18n="intakeClearBtn">清空</button>
        <button type="button" class="btn linkish" id="manualOpen" data-i18n="manualOpen">改为手动填写</button>
      </div>
      <p class="form-msg" id="agentMsg"></p>
    </section>

    <!-- ② AI 草稿编辑 / 手工降级 -->
    <section class="card draft-card" id="draftSection" hidden>
      <div class="card-head">
        <h2><span aria-hidden="true">📝</span> <span data-i18n="formTitle">草稿编辑与手工报修</span></h2>
        <span class="tag" id="formAiTag" hidden data-i18n="tagAiFilled">AI 已填充</span>
      </div>
      <p class="hint" data-i18n="manualFallbackHint">AI 不可用时，可在这里直接填写并提交。</p>
      <div class="agent-draft" id="agentDraft" hidden></div>

      <label class="lbl" for="fTitle" data-i18n="lblTitle">工单标题</label>
      <input type="text" id="fTitle" maxlength="80" data-i18n-ph="phTitle">

      <label class="lbl" data-i18n="lblType">损坏类型</label>
      <div class="chips types" id="typeChips"></div>

      <!-- 报修地点：默认锁定在账号登记的宿舍；只有公共区域才需要另填地址 -->
      <div class="addr" id="addr">
        <div class="addr-head">
          <label class="lbl" data-i18n="lblAddress">报修地点</label>
          <label class="addr-toggle" for="fPublic">
            <input type="checkbox" id="fPublic">
            <span data-i18n="lblPublicArea">公共区域报修</span>
          </label>
        </div>

        <p class="addr-own" id="addrOwn"></p>
        <p class="addr-note" id="addrNote"></p>

        <div id="addrFields" hidden>
          <div class="grid2">
            <div>
              <label class="lbl" for="fCollege" data-i18n="lblCollege">书院</label>
              <select id="fCollege"></select>
            </div>
            <div>
              <label class="lbl" for="fBlock" data-i18n="lblBlock">楼栋 / 座</label>
              <select id="fBlock"></select>
            </div>
          </div>
          <p class="blk-hint" id="blockHint"></p>

          <label class="lbl" for="fDorm" data-i18n="lblPublicWhere">公共区域位置</label>
          <input type="text" id="fDorm" maxlength="40" data-i18n-ph="phPublicWhere">
        </div>
      </div>

      <label class="lbl" data-i18n="lblPriority">紧急度</label>
      <div class="chips priorities" id="priChips"></div>

      <label class="lbl" for="fDate" data-i18n="lblDate">期望维修日期</label>
      <select id="fDate"></select>

      <label class="lbl">
        <span data-i18n="lblSlots">空闲时间（可多选，每格 30 分钟）</span>
        <span class="lbl-note" data-i18n="lblSlotsNote">点击或拖动选择；系统只会把这一单排进你勾选的时段</span>
      </label>
      <div class="slot-wrap">
        <div class="slot-grid" id="slotGrid"></div>
        <div class="slot-side">
          <button type="button" class="btn tiny" id="slotClear" data-i18n="slotClear">清空</button>
          <button type="button" class="btn tiny" id="slotMorning" data-i18n="slotMorning">上午</button>
          <button type="button" class="btn tiny" id="slotAfternoon" data-i18n="slotAfternoon">下午</button>
          <button type="button" class="btn tiny" id="slotAll" data-i18n="slotAll">全天</button>
        </div>
      </div>
      <p class="slot-summary" id="slotSummary"></p>

      <div class="grid2">
        <div>
          <label class="lbl" for="fName" data-i18n="lblName">姓名（选填）</label>
          <input type="text" id="fName" maxlength="60" data-i18n-ph="phName">
        </div>
        <div>
          <label class="lbl" for="fContact" data-i18n="lblContact">联系方式（选填）</label>
          <input type="text" id="fContact" maxlength="80" data-i18n-ph="phContact">
          <p class="blk-hint" id="contactHint" hidden></p>
        </div>
      </div>

      <label class="lbl" for="fDesc" data-i18n="lblDesc">故障描述（选填）</label>
      <textarea id="fDesc" rows="2" maxlength="1000" data-i18n-ph="phDesc"></textarea>

      <div class="row">
        <button type="button" class="btn primary big" id="agentConfirm" data-i18n="agentConfirm" hidden>确认提交工单</button>
        <button type="button" class="btn primary big" id="submitBtn" data-i18n="submitBtn">手动提交报修</button>
      </div>
      <p class="form-msg" id="formMsg"></p>
    </section>

  </main>

  <section class="setup-wrap">
    <div class="setup" id="setup" hidden>
      <h3><span aria-hidden="true">🔑</span> <span data-i18n="setupTitle">启用模型密钥</span></h3>
      <p data-i18n-html="setupBody"></p>
      <form id="setupForm" autocomplete="off">
        <input type="password" id="setupKey" autocomplete="off" spellcheck="false"
               data-i18n-ph="setupPlaceholder" data-i18n-aria="setupTitle">
        <button type="submit" class="btn primary" id="setupBtn" data-i18n="setupSubmit">启用</button>
      </form>
      <p class="form-msg" id="setupMsg"></p>
    </div>
  </section>

</div>
<script src="/common.js"></script>
<script src="/student-report.js"></script>
</body>
</html>
