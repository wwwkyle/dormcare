<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="adRosterPageTitle">维修班组 · DormCare</title>
<meta name="description" content="DormCare 管理员端 — 师傅名册、工种与可承接类别。Technician roster of DormCare.">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="mark admin" aria-hidden="true">🧭</div>
      <div class="brand-text">
        <h1 data-i18n="adRosterPageTitle">维修班组 · DormCare</h1>
        <p data-i18n="adminSub">DormCare 运维管理台</p>
      </div>
    </div>
    <div class="topbar-right">
      <div class="lang" id="lang" role="group" aria-label="Language / 语言">
        <button type="button" data-lang="zh" aria-pressed="true">中文</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <div class="status" id="status" data-state="checking">
        <span class="dot"></span><span id="statusText" data-i18n="statusChecking">连接中…</span>
      </div>
    </div>
  </header>

  <nav class="rolebar" data-rolebar>
    <span class="here" data-i18n="roleAdmin">管理员</span>
    <span class="rolebar-note" id="adminIdentity"></span>
    <div class="userchip" id="userChip" hidden></div>
  </nav>

  <main class="stack">

    <section class="card">
      <div class="card-head">
        <h2><span aria-hidden="true">🛠️</span> <span data-i18n="adWorkersSection">维修班组</span></h2>
        <div class="head-actions">
          <span class="count" id="adRosterCount"></span>
          <button type="button" class="btn tiny" id="adReload" data-i18n="adReload">刷新</button>
          <button type="button" class="btn tiny primary" id="adNewWorkerBtn" data-i18n="adNewWorker">发放师傅账号</button>
        </div>
      </div>
      <div class="ad-list" id="adWorkerList"></div>
    </section>

    <p class="form-msg" id="adMsg"></p>

  </main>

  <section class="setup-wrap">
    <div class="setup" id="setup" hidden>
      <h3><span aria-hidden="true">🔑</span> <span data-i18n="setupTitle">启用模型密钥</span></h3>
      <p data-i18n-html="setupBody"></p>
      <form id="setupForm" autocomplete="off">
        <select id="setupProvider" data-i18n-aria="setupProvider">
          <option value="openrouter" data-i18n="providerOpenrouter">OpenRouter</option>
          <option value="openai">OpenAI</option>
          <option value="deepseek">DeepSeek</option>
          <option value="moonshot" data-i18n="providerMoonshot">月之暗面</option>
          <option value="zhipu" data-i18n="providerZhipu">智谱</option>
          <option value="siliconflow" data-i18n="providerSilicon">硅基流动</option>
          <option value="dashscope" data-i18n="providerDashscope">通义千问</option>
          <option value="custom" data-i18n="providerCustom">自定义兼容接口</option>
        </select>
        <input type="text" id="setupModel" autocomplete="off" spellcheck="false"
               data-i18n-ph="setupModelPh" data-i18n-aria="setupModelPh">
        <input type="password" id="setupKey" autocomplete="off" spellcheck="false"
               data-i18n-ph="setupPlaceholder" data-i18n-aria="setupTitle">
        <button type="submit" class="btn primary" id="setupBtn" data-i18n="setupSubmit">启用</button>
        <input type="url" id="setupBase" hidden autocomplete="off" spellcheck="false"
               data-i18n-ph="setupBasePh" data-i18n-aria="setupBasePh">
      </form>
      <p class="form-msg" id="setupMsg"></p>
    </div>
  </section>

</div>
<script src="/common.js"></script>
<script src="/admin-roster.js"></script>
</body>
</html>
