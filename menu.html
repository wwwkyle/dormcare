<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="menuTitle">DormCare 主菜单</title>
<meta name="description" content="DormCare 主菜单 — 登录后的统一入口，按角色列出可进入的功能。Main menu of DormCare.">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="mark" id="menuMark" aria-hidden="true">🏠</div>
      <div class="brand-text">
        <h1 data-i18n="menuTitle">DormCare 主菜单</h1>
        <p data-i18n="menuSub">选择要进入的功能</p>
      </div>
    </div>
    <div class="topbar-right">
      <div class="lang" id="lang" role="group" aria-label="Language / 语言">
        <button type="button" data-lang="zh" aria-pressed="true">中文</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <div class="status" id="status" data-state="checking">
        <span class="dot"></span><span id="statusText" data-i18n="statusChecking">连接中…</span>
      </div>
    </div>
  </header>

  <nav class="rolebar">
    <span class="here" id="menuRole">…</span>
    <span class="rolebar-note" id="menuHello"></span>
    <div class="userchip" id="userChip" hidden></div>
  </nav>

  <main class="stack">

    <!-- 功能入口 / the sections this role may open -->
    <p class="menu-hint" id="menuHint"></p>
    <section class="menu-grid" id="menuGrid"></section>

  </main>

  <section class="setup-wrap">
    <div class="setup" id="setup" hidden>
      <h3><span aria-hidden="true">🔑</span> <span data-i18n="setupTitle">启用模型密钥</span></h3>
      <p data-i18n-html="setupBody"></p>
      <form id="setupForm" autocomplete="off">
        <input type="password" id="setupKey" autocomplete="off" spellcheck="false"
               data-i18n-ph="setupPlaceholder" data-i18n-aria="setupTitle">
        <button type="submit" class="btn primary" id="setupBtn" data-i18n="setupSubmit">启用</button>
      </form>
      <p class="form-msg" id="setupMsg"></p>
    </div>
  </section>

</div>
<script src="/common.js"></script>
<script src="/menu.js"></script>
</body>
</html>
