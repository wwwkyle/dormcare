<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="adTicketPageTitle">全部工单 · DormCare</title>
<meta name="description" content="DormCare 管理员端 — 全系统报修单。All tickets of DormCare.">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="mark admin" aria-hidden="true">🧭</div>
      <div class="brand-text">
        <h1 data-i18n="adTicketPageTitle">全部工单 · DormCare</h1>
        <p data-i18n="adminSub">DormCare 运维管理台</p>
      </div>
    </div>
    <div class="topbar-right">
      <div class="lang" id="lang" role="group" aria-label="Language / 语言">
        <button type="button" data-lang="zh" aria-pressed="true">中文</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <div class="status" id="status" data-state="checking">
        <span class="dot"></span><span id="statusText" data-i18n="statusChecking">连接中…</span>
      </div>
    </div>
  </header>

  <nav class="rolebar" data-rolebar>
    <span class="here" data-i18n="roleAdmin">管理员</span>
    <span class="rolebar-note" id="adminIdentity"></span>
    <div class="userchip" id="userChip" hidden></div>
  </nav>

  <main class="stack">

    <section class="card">
      <div class="card-head">
        <h2><span aria-hidden="true">📋</span> <span data-i18n="adTicketSection">全部工单</span></h2>
        <div class="head-actions">
          <span class="count" id="adTicketCount"></span>
          <select id="adStatusFilter" class="mini-select" data-i18n-aria="adStatusFilter"></select>
          <button type="button" class="btn tiny primary" id="adNewTicket" data-i18n="adNewTicket">新建工单</button>
          <button type="button" class="btn tiny" id="adReload" data-i18n="adReload">刷新</button>
        </div>
      </div>
      <div class="fold-list" id="adTicketList"></div>
    </section>

    <section class="card" id="adTicketEditor" hidden>
      <div class="card-head">
        <h2 id="adEditorTitle" data-i18n="adCreateTicket">新建工单</h2>
        <button type="button" class="btn tiny" id="adEditorCancel" data-i18n="adCancel">取消</button>
      </div>
      <form id="adTicketForm" class="admin-ticket-form" autocomplete="off">
        <input type="hidden" id="adEditId">
        <input type="hidden" id="adEditVersion">
        <label><span data-i18n="adOwner">报修人</span>
          <select id="adOwnerUser" required></select>
        </label>
        <label><span data-i18n="lblTitle">标题</span>
          <input type="text" id="adTitle" maxlength="80" required>
        </label>
        <label><span data-i18n="lblType">报修类别</span>
          <select id="adRepairType" required></select>
        </label>
        <label><span data-i18n="lblPriority">紧急程度</span>
          <select id="adPriority" required></select>
        </label>
        <label><span data-i18n="lblDate">预约日期</span>
          <select id="adDate" required></select>
        </label>
        <label><span data-i18n="adSlotsInput">空闲时段（如 0-3,12-16）</span>
          <input type="text" id="adSlots" placeholder="0-3,12-16" required>
        </label>
        <label><span data-i18n="lblName">联系人</span>
          <input type="text" id="adStudentName" maxlength="60">
        </label>
        <label><span data-i18n="lblContact">联系方式</span>
          <input type="text" id="adContactInput" maxlength="80">
        </label>
        <label><span data-i18n="lblCollege">书院</span>
          <select id="adCollege" required></select>
        </label>
        <label><span data-i18n="lblBlock">楼栋</span>
          <select id="adBlock"></select>
        </label>
        <label><span data-i18n="lblDorm">宿舍 / 位置</span>
          <input type="text" id="adDorm" maxlength="30" required>
        </label>
        <label class="checkline"><input type="checkbox" id="adPublic">
          <span data-i18n="lblPublicArea">公共区域报修</span>
        </label>
        <label class="wide"><span data-i18n="lblDesc">故障描述</span>
          <textarea id="adDescription" rows="4" maxlength="1000"></textarea>
        </label>
        <div id="adLifecycleFields" class="admin-ticket-lifecycle wide" hidden>
          <label><span data-i18n="adStatus">状态</span>
            <select id="adStatus"></select>
          </label>
          <label><span data-i18n="adAssign">负责师傅</span>
            <select id="adWorker"></select>
          </label>
          <label class="checkline"><input type="checkbox" id="adOverride">
            <span data-i18n="adOverrideEvidence">无完工图应急修正</span>
          </label>
          <label><span data-i18n="adOverrideReason">应急修正原因</span>
            <input type="text" id="adOverrideReason" maxlength="300">
          </label>
        </div>
        <div class="form-actions wide">
          <button type="submit" class="btn primary" id="adTicketSave" data-i18n="adSave">保存</button>
          <button type="button" class="btn" id="adTicketCancel" data-i18n="adCancel">取消</button>
        </div>
      </form>
      <p class="hint" data-i18n="adOwnerLocked">不能更换报修人。</p>
    </section>

    <p class="form-msg" id="adMsg"></p>

  </main>

  <section class="setup-wrap">
    <div class="setup" id="setup" hidden>
      <h3><span aria-hidden="true">🔑</span> <span data-i18n="setupTitle">启用模型密钥</span></h3>
      <p data-i18n-html="setupBody"></p>
      <form id="setupForm" autocomplete="off">
        <select id="setupProvider" data-i18n-aria="setupProvider">
          <option value="openrouter" data-i18n="providerOpenrouter">OpenRouter</option>
          <option value="openai">OpenAI</option>
          <option value="deepseek">DeepSeek</option>
          <option value="moonshot" data-i18n="providerMoonshot">月之暗面</option>
          <option value="zhipu" data-i18n="providerZhipu">智谱</option>
          <option value="siliconflow" data-i18n="providerSilicon">硅基流动</option>
          <option value="dashscope" data-i18n="providerDashscope">通义千问</option>
          <option value="custom" data-i18n="providerCustom">自定义兼容接口</option>
        </select>
        <input type="text" id="setupModel" autocomplete="off" spellcheck="false"
               data-i18n-ph="setupModelPh" data-i18n-aria="setupModelPh">
        <input type="password" id="setupKey" autocomplete="off" spellcheck="false"
               data-i18n-ph="setupPlaceholder" data-i18n-aria="setupTitle">
        <button type="submit" class="btn primary" id="setupBtn" data-i18n="setupSubmit">启用</button>
        <input type="url" id="setupBase" hidden autocomplete="off" spellcheck="false"
               data-i18n-ph="setupBasePh" data-i18n-aria="setupBasePh">
      </form>
      <p class="form-msg" id="setupMsg"></p>
    </div>
  </section>

</div>
<script src="/common.js"></script>
<script src="/admin-tickets.js"></script>
</body>
</html>
